# @package _global_
defaults:
  - override /readout: mlp

model:
  name: atom_jepa_multiconf
  type: atom_jepa_multiconf
  checkpoint: molecules   
  precision: fp32         
  freeze_encoder: false   # true trains only the readout head
  encoder_lr: 1.0e-5
  readout_lr: 1.0e-3
  conformer_folder: conformers_multi
  augment: true
  conformer_index: 0
  max_conformers: 0

train:
  epochs: 20
  batch_size: 8
  weight_decay: 1.0e-4
  grad_clip: 1.0